[pytest]
# Pytest configuration for integration tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for categorizing tests
markers =
    integration: End-to-end integration tests
    slow: Tests that take longer to run
    requires_aws: Tests that require AWS services (when not mocked)
    auth: Authentication and authorization tests
    realtime: Real-time update tests
    log_flow: Complete log flow tests

# Test paths
testpaths = .

# Coverage options (when using --cov)
[coverage:run]
source = 
    interpose.agent
    backend
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
