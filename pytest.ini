[pytest]
# Pytest configuration for Interpose platform

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = 
    interpose/agent/tests
    backend/tests

# Coverage settings
addopts = 
    --verbose
    --cov=interpose
    --cov=backend
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=85

# Hypothesis settings
hypothesis_profile = default

[hypothesis]
# Property-based testing configuration
max_examples = 100
derandomize = True
verbosity = normal
