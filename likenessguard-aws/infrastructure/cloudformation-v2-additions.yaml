AWSTemplateFormatVersion: '2010-09-09'
Description: >
  LikenessGuard v2 Additions - New resources only.
  Adds KMS, OpenSearch, new DynamoDB tables, new Lambda functions.
  Requires existing likenessguard-prototype stack.

Parameters:
  BedrockRegion:
    Type: String
    Default: 'us-east-1'
  SimilarityThreshold:
    Type: String
    Default: '0.85'
  LambdaCodeBucket:
    Type: String
    Default: 'aws-sam-cli-managed-default-samclisourcebucket-4hluf36xrni1'
  LambdaCodeKey:
    Type: String
    Default: 'likenessguard-v2/likenessguard-v2-src.zip'

Resources:

  # ── KMS KEY ─────────────────────────────────────────────────────────────────
  ProofOfFaceSigningKey:
    Type: AWS::KMS::Key
    Properties:
      Description: LikenessGuard Proof-of-Face ECDSA P-256 Signing Key
      KeySpec: ECC_NIST_P256
      KeyUsage: SIGN_VERIFY
      EnableKeyRotation: false
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  ProofOfFaceSigningKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/likenessguard-pof-signing
      TargetKeyId: !Ref ProofOfFaceSigningKey

  # ── JWKS S3 BUCKET ──────────────────────────────────────────────────────────
  JWKSBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'likenessguard-jwks-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  JWKSBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref JWKSBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadJWKS
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${JWKSBucket.Arn}/.well-known/*'

  # ── OPENSEARCH SERVERLESS ───────────────────────────────────────────────────
  OpenSearchEncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: likenessguard-encryption
      Type: encryption
      Policy: >
        {"Rules":[{"ResourceType":"collection","Resource":["collection/likenessguard-vectors"]}],"AWSOwnedKey":true}

  OpenSearchNetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: likenessguard-network
      Type: network
      Policy: >
        [{"Rules":[{"ResourceType":"collection","Resource":["collection/likenessguard-vectors"]},
        {"ResourceType":"dashboard","Resource":["collection/likenessguard-vectors"]}],
        "AllowFromPublic":true}]

  OpenSearchAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: likenessguard-access
      Type: data
      Policy: !Sub >
        [{"Rules":[{"ResourceType":"index","Resource":["index/likenessguard-vectors/*"],
        "Permission":["aoss:CreateIndex","aoss:DeleteIndex","aoss:UpdateIndex",
        "aoss:DescribeIndex","aoss:ReadDocument","aoss:WriteDocument"]},
        {"ResourceType":"collection","Resource":["collection/likenessguard-vectors"],
        "Permission":["aoss:CreateCollectionItems","aoss:DeleteCollectionItems",
        "aoss:UpdateCollectionItems","aoss:DescribeCollectionItems"]}],
        "Principal":["arn:aws:iam::${AWS::AccountId}:role/LikenessGuard-LambdaExecutionRole"]}]

  VectorCollection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn:
      - OpenSearchEncryptionPolicy
      - OpenSearchNetworkPolicy
    Properties:
      Name: likenessguard-vectors
      Type: VECTORSEARCH
      Description: Facial vector embeddings for LikenessGuard v2

  # ── NEW DYNAMODB TABLES ──────────────────────────────────────────────────────
  FederationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: LikenessGuard-Federation
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PeerID
          AttributeType: S
      KeySchema:
        - AttributeName: PeerID
          KeyType: HASH

  SuspensionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: LikenessGuard-Suspensions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: RequesterID
          AttributeType: S
      KeySchema:
        - AttributeName: RequesterID
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: TTL
        Enabled: true

  # ── NEW LAMBDA FUNCTIONS ─────────────────────────────────────────────────────
  SupervisorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: LikenessGuard-Supervisor
      Runtime: python3.13
      Handler: lambdas.supervisor.handler.lambda_handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LikenessGuard-LambdaExecutionRole'
      Timeout: 30
      MemorySize: 1024
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          CONSENT_REGISTRY_TABLE: LikenessGuard-ConsentRegistry
          AUDIT_LOG_TABLE: LikenessGuard-AuditLog
          SUSPENSION_TABLE: LikenessGuard-Suspensions
          SIMILARITY_THRESHOLD: !Ref SimilarityThreshold
          USE_OPENSEARCH: 'true'
          OPENSEARCH_ENDPOINT: !GetAtt VectorCollection.CollectionEndpoint
          KMS_SIGNING_KEY_ARN: !GetAtt ProofOfFaceSigningKey.Arn
          JWKS_URL: !Sub 'https://${JWKSBucket.RegionalDomainName}/.well-known/jwks.json'
          BEDROCK_REGION: !Ref BedrockRegion
          ANOMALY_AGENT_FN: LikenessGuard-AnomalyAgent
          ORCHESTRATOR_FN: LikenessGuard-ConsentOrchestrator
          POLICY_REASONER_FN: LikenessGuard-PolicyReasoner
          LOG_LEVEL: INFO

  AnomalyAgentFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: LikenessGuard-AnomalyAgent
      Runtime: python3.13
      Handler: lambdas.anomaly_agent.handler.lambda_handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LikenessGuard-LambdaExecutionRole'
      Timeout: 10
      MemorySize: 512
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          SUSPENSION_TABLE: LikenessGuard-Suspensions
          BEDROCK_REGION: !Ref BedrockRegion
          LOG_LEVEL: INFO

  ConsentOrchestratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: LikenessGuard-ConsentOrchestrator
      Runtime: python3.13
      Handler: lambdas.consent_orchestrator.handler.lambda_handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LikenessGuard-LambdaExecutionRole'
      Timeout: 15
      MemorySize: 512
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          SIMILARITY_THRESHOLD: !Ref SimilarityThreshold
          BEDROCK_REGION: !Ref BedrockRegion
          LOG_LEVEL: INFO

  PolicyReasonerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: LikenessGuard-PolicyReasoner
      Runtime: python3.13
      Handler: lambdas.policy_reasoner.handler.lambda_handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LikenessGuard-LambdaExecutionRole'
      Timeout: 15
      MemorySize: 512
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          BEDROCK_REGION: !Ref BedrockRegion
          LOG_LEVEL: INFO

  ProofVerifyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: LikenessGuard-ProofVerify
      Runtime: python3.13
      Handler: lambdas.proof_verify.handler.lambda_handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LikenessGuard-LambdaExecutionRole'
      Timeout: 10
      MemorySize: 256
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          KMS_SIGNING_KEY_ARN: !GetAtt ProofOfFaceSigningKey.Arn
          JWKS_URL: !Sub 'https://${JWKSBucket.RegionalDomainName}/.well-known/jwks.json'
          LOG_LEVEL: INFO

  FederationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: LikenessGuard-Federation
      Runtime: python3.13
      Handler: lambdas.federation.handler.lambda_handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LikenessGuard-LambdaExecutionRole'
      Timeout: 15
      MemorySize: 512
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          FEDERATION_TABLE: LikenessGuard-Federation
          CONSENT_REGISTRY_TABLE: LikenessGuard-ConsentRegistry
          AUDIT_LOG_TABLE: LikenessGuard-AuditLog
          OPENSEARCH_ENDPOINT: !GetAtt VectorCollection.CollectionEndpoint
          LOG_LEVEL: INFO

  BackfillFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: LikenessGuard-Backfill
      Runtime: python3.13
      Handler: lambdas.backfill.handler.lambda_handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LikenessGuard-LambdaExecutionRole'
      Timeout: 900
      MemorySize: 1024
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          CONSENT_REGISTRY_TABLE: LikenessGuard-ConsentRegistry
          OPENSEARCH_ENDPOINT: !GetAtt VectorCollection.CollectionEndpoint
          LOG_LEVEL: INFO

  # ── LOG GROUPS ───────────────────────────────────────────────────────────────
  SupervisorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/LikenessGuard-Supervisor
      RetentionInDays: 2557

  AnomalyAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/LikenessGuard-AnomalyAgent
      RetentionInDays: 2557

  PolicyReasonerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/LikenessGuard-PolicyReasoner
      RetentionInDays: 2557

  ConsentOrchestratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/LikenessGuard-ConsentOrchestrator
      RetentionInDays: 2557

Outputs:
  ProofOfFaceKeyArn:
    Value: !GetAtt ProofOfFaceSigningKey.Arn
    Export:
      Name: LikenessGuard-v2-KMSKeyArn

  JWKSBucketName:
    Value: !Ref JWKSBucket
    Export:
      Name: LikenessGuard-v2-JWKSBucket

  VectorCollectionEndpoint:
    Value: !GetAtt VectorCollection.CollectionEndpoint
    Export:
      Name: LikenessGuard-v2-OpenSearchEndpoint

  SupervisorFunctionArn:
    Value: !GetAtt SupervisorFunction.Arn
    Export:
      Name: LikenessGuard-v2-SupervisorArn
