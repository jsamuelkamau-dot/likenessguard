name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flake8
      - name: Lint Lambda handlers
        run: flake8 likenessguard-aws/src/lambdas/ --max-line-length=150 --ignore=E501,W503,E402,F401,F811,E722,W291,W293,E303,E302,E261,E262,W292,E401,W391,E226,E701,E127,F821,F841,F541 --exclude=__pycache__

  lint-mcp:
    name: MCP Server Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flake8
      - run: flake8 likenessguard-mcp/ --max-line-length=150 --ignore=E501,W503,E402,F401,E722,W291,W293,E303,E302,E401,W391,E226,E701,E127 --exclude=__pycache__

  build-dashboard:
    name: Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd likenessguard-dashboard && npm ci
      - name: Build (skip type check)
        run: cd likenessguard-dashboard && npx vite build
        env:
          VITE_API_BASE_URL: https://example.execute-api.us-east-1.amazonaws.com/v1

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - name: Run unit tests
        run: python -m pytest likenessguard-aws/tests/ -v --tb=short --no-header --rootdir=. --override-ini="addopts="
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
