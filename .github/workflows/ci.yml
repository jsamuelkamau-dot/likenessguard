name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install flake8
      - run: flake8 likenessguard-aws/src/lambdas/ --max-line-length=150 --ignore=E501,W503,E402,F401,F811,E722,W291,W293,E303,E302,E261,E262,W292,E401,W391,E226,E701,E127,F821,F841,F541 --exclude=__pycache__

  lint-mcp:
    name: MCP Server Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install flake8
      - run: flake8 likenessguard-mcp/ --max-line-length=150 --ignore=E501,W503,E402,F401,E722,W291,W293,E303,E302,E401,W391,E226,E701,E127 --exclude=__pycache__

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: cd likenessguard-aws && python -m pytest tests/ -v --tb=short
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
